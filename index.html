<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دوامي - تسجيل الموظف</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <!-- شاشة الدخول عبر الكود -->
  <div id="loginSection" class="card login-card">
    <h2>تسجيل الدخول - دوامي</h2>
    <p class="subtitle">أدخل كود الموظف للدخول المباشر</p>
    
    <input type="text" id="employeeCodeInput" placeholder="أدخل كودك الخاص (مثال: 1001)" class="form-input">
    <button class="btn btn-primary btn-full" onclick="loginWithCode()">دخول</button>
    
    <p id="loginError" class="error-msg"></p>
  </div>

  <!-- لوحة الموظف بعد الدخول -->
  <div id="dashboardSection" class="card" style="display: none;">
    <div class="header-flex">
      <h2>مواظبة الدوام اليومي</h2>
      <button class="btn btn-logout no-print" onclick="logout()">تسجيل الخروج</button>
    </div>
    
    <p class="user-greeting">أهلاً بك، <strong id="employeeName"></strong> (كود: <span id="employeeCodeDisplay"></span>)</p>
    <hr class="divider">

    <div class="actions-flex">
      <button id="breakBtn" class="btn btn-break" onclick="toggleBreak()">بدء الاستراحة (Break)</button>
      <button class="btn btn-print no-print" onclick="window.print()">طباعة تقرير اليوم</button>
    </div>

    <div id="statusBox" class="status-box">
      <p>حالة الدوام: <strong id="currentStatus" class="txt-success">على رأس العمل</strong></p>
      <p id="breakLog">وقت الاستراحة المسجل: لا يوجد</p>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
