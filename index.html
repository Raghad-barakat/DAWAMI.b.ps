<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البوابة الرئيسية | DAWAMIbps</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%); 
            height: 100vh; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: white;
        }
        .container { 
            text-align: center; 
            background: rgba(255, 255, 255, 0.1); 
            padding: 50px; 
            border-radius: 20px; 
            backdrop-filter: blur(10px); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
        }
        h1 { font-size: 3rem; margin-bottom: 10px; }
        p { font-size: 1.2rem; margin-bottom: 40px; opacity: 0.9; }
        .btn-group { display: flex; gap: 20px; justify-content: center; }
        .btn { 
            text-decoration: none; 
            padding: 15px 30px; 
            border-radius: 10px; 
            font-size: 1.2rem; 
            font-weight: bold; 
            transition: 0.3s; 
            cursor: pointer;
        }
        .btn-admin { 
            background: #e74c3c; 
            color: white; 
            border: 2px solid #e74c3c;
        }
        .btn-admin:hover { background: transparent; color: #e74c3c; }
        .btn-emp { 
            background: #2ecc71; 
            color: white; 
            border: 2px solid #2ecc71;
        }
        .btn-emp:hover { background: transparent; color: #2ecc71; }
    </style>
</head>
<body>

    <div class="container">
        <h1>نظام DAWAMIbps</h1>
        <p>نظام إدارة الحضور والانصراف الذكي</p>
        
        <div class="btn-group">
            <a href="admin_dashboard.html" class="btn btn-admin">لوحة تحكم المدير 🛠️</a>
            <a href="employee_dashboard.html" class="btn btn-emp">بوابة الموظفين 👤</a>
        </div>
    </div>

</body>
</html>
