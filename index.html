<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دوامي - تسجيل الموظف</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <!-- شاشة تسجيل الدخول للكود -->
  <div id="loginSection" class="card" style="max-width: 400px; margin: 40px auto; text-align: center;">
    <h2>تسجيل الدخول - دوامي</h2>
    <p style="margin-bottom: 15px; color: #64748b;">أدخل الكود الخاص بك للمتابعة</p>
    
    <input type="text" id="employeeCodeInput" placeholder="أدخل كود الموظف (مثال: 1001)" class="form-input">
    <button class="btn btn-primary" onclick="loginWithCode()" style="width: 100%; margin-top: 10px;">دخول</button>
    
    <p id="loginError" style="color: var(--danger-color); font-size: 0.85rem; margin-top: 10px; display: none;"></p>
  </div>

  <!-- لوحة الموظف الرئيسية (تظهر بعد الدخول وتتذكر الموظف) -->
  <div id="dashboardSection" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-align: center;">
      <h2>مواظبة الدوام اليومي</h2>
      <button class="btn btn-logout no-print" onclick="logout()">تسجيل الخروج</button>
    </div>
    
    <p style="margin-top: 10px;">أهلاً بك، <strong id="employeeName"></strong></p>
    <hr style="margin: 15px 0; border: 0; border-top: 1px solid #e2e8f0;">

    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
      <button id="breakBtn" class="btn btn-break" onclick="toggleBreak()">بدء الاستراحة (Break)</button>
      <button class="btn btn-print no-print" onclick="window.print()">طباعة تقرير اليوم</button>
    </div>

    <div id="statusBox" style="padding: 12px; background: #f1f5f9; border-radius: 8px;">
      <p>حالة الدوام: <strong id="currentStatus" style="color: var(--success-color);">على رأس العمل</strong></p>
      <p id="breakLog">وقت الاستراحة المسجل: لا يوجد</p>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
