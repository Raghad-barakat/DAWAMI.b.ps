<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام دوامي - تسجيل الدخول والدوام</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <!-- شاشة تسجيل الدخول -->
  <div id="loginSection" class="card">
    <h2>تسجيل دخول الموظف</h2>
    <p class="subtitle">أدخل الكود الخاص بك للدخول إلى نظام الدوام</p>
    
    <div class="form-group">
      <label for="employeeCodeInput">كود الموظف:</label>
      <input type="text" id="employeeCodeInput" placeholder="أدخل الكود (مثال: 1001)" autocomplete="off">
    </div>

    <div id="loginError" class="error-msg" style="display: none;"></div>

    <button class="btn btn-primary" onclick="loginWithCode()">تسجيل الدخول</button>
  </div>

  <!-- لوحة الموظف الرئيسية -->
  <div id="dashboardSection" class="card" style="display: none;">
    <div class="header-flex">
      <div>
        <h2>أهلاً بك، <span id="employeeName"></span></h2>
        <p class="subtitle">كود الموظف: <code id="employeeCodeDisplay"></code></p>
      </div>
      <button class="btn btn-logout" onclick="logout()">تسجيل الخروج</button>
    </div>

    <div class="status-box">
      <p>حالة الدوام الحالية: <strong id="currentStatus">على رأس العمل</strong></p>
      <p id="breakLog" class="break-log-text"></p>
    </div>

    <div class="actions">
      <button id="breakBtn" class="btn btn-warning" onclick="toggleBreak()">بدء الاستراحة (Break)</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
