<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إكمال البيانات | DAWAMIbps</title>
    <style>
        body { font-family: 'Segoe UI', Arial; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 400px; }
        h2 { text-align: center; color: #2c3e50; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>تسجيل بيانات الموظف</h2>
        <form id="profileForm">
            <div class="input-group"><label>الاسم الرباعي</label><input type="text" id="fullName" required></div>
            <div class="input-group"><label>رقم الهوية</label><input type="number" id="nationalId" required></div>
            <div class="input-group"><label>رقم الهاتف</label><input type="tel" id="phone" required></div>
            <div class="input-group"><label>المسمى الوظيفي</label><input type="text" id="jobTitle" required></div>
            <button type="submit">حفظ البيانات والدخول</button>
        </form>
    </div>
    <script type="module">
        import { db } from './firebase-config.js';
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id') || 'temp_user';

        document.getElementById('profileForm').onsubmit = async (e) => {
            e.preventDefault();
            await setDoc(doc(db, "users", userId), {
                fullName: document.getElementById('fullName').value,
                nationalId: document.getElementById('nationalId').value,
                phone: document.getElementById('phone').value,
                jobTitle: document.getElementById('jobTitle').value,
                role: 'employee'
            });
            alert("تم الحفظ بنجاح!");
            window.location.href = `employee_dashboard.html?id=${userId}`;
        };
    </script>
</body>
</html>
