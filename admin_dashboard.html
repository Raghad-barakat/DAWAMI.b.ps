<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة DAWAMIbps</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f0f2f5; display: flex; }
        .sidebar { width: 250px; background: #2c3e50; color: white; height: 100vh; padding: 20px; }
        .main-content { flex: 1; padding: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .section { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { padding: 10px; margin: 5px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; cursor: pointer; border-radius: 5px; border: none; color: white; font-weight: bold; }
        .btn-save { background: #27ae60; } .btn-add { background: #3498db; } .btn-alert { background: #e67e22; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>DAWAMIbps Admin</h2>
        <p>الرئيسية</p><p>الموظفين</p><p>التقارير</p>
    </div>
    <div class="main-content">
        <h1>لوحة تحكم المدير</h1>
        <div class="stats-grid">
            <div class="stat-card"><h3>الحاضرون اليوم</h3><p id="present">0</p></div>
            <div class="stat-card"><h3>نسوا تسجيل الخروج</h3><p id="forgot">0</p></div>
            <div class="stat-card"><h3>إجمالي الموظفين</h3><p id="total">0</p></div>
        </div>

        <div class="section">
            <h3>📍 إعدادات موقع الشركة</h3>
            <input type="text" id="lat" placeholder="Latitude">
            <input type="text" id="lng" placeholder="Longitude">
            <input type="number" id="radius" placeholder="النطاق بالمتر">
            <button class="btn-save" id="saveLoc">حفظ الموقع</button>
        </div>

        <div class="section">
            <h3>👤 إضافة موظف جديد</h3>
            <input type="text" id="newEmpName" placeholder="الاسم">
            <input type="email" id="newEmpEmail" placeholder="الايميل">
            <button class="btn-add" id="addEmp">إضافة</button>
        </div>

        <div class="section">
            <h3>🔔 التنبيهات</h3>
            <button class="btn-alert" id="sendRemind">إرسال تذكير للمنسيين</button>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { doc, setDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

        // حفظ الموقع
        document.getElementById('saveLoc').onclick = async () => {
            await setDoc(doc(db, "settings", "company"), {
                lat: parseFloat(document.getElementById('lat').value),
                lng: parseFloat(document.getElementById('lng').value),
                radius: parseInt(document.getElementById('radius').value)
            });
            alert("تم حفظ الموقع!");
        };

        // إضافة موظف
        document.getElementById('addEmp').onclick = async () => {
            const id = Date.now().toString(); // معرف عشوائي مؤقت
            await setDoc(doc(db, "users", id), {
                fullName: document.getElementById('newEmpName').value,
                email: document.getElementById('newEmpEmail').value,
                role: 'employee'
            });
            alert("تم إضافة الموظف!");
        };

        // إرسال تذكير (محاكاة)
        document.getElementById('sendRemind').onclick = () => {
            alert("تم إرسال إشعارات لجميع الموظفين الذين لم يسجلوا خروج!");
        };
    </script>
</body>
</html>
