<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دوامي - لوحة إشراف المدير</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="card">
    <div class="header-flex no-print">
      <h2>سجل بيانات وحضور الموظفين</h2>
      <button class="btn btn-print" onclick="window.print()">طباعة تقرير الموظفين</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>اسم الموظف</th>
            <th>كود الدخول</th>
            <th>رقم الهوية</th>
            <th>رقم الهاتف</th>
            <th>المبلغ</th>
            <th>النسبة</th>
            <th>حالة الدوام</th>
            <th>مدة الاستراحة</th>
            <th class="no-print">إجراءات</th>
          </tr>
        </thead>
        <tbody id="employeeTableBody">
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- نافذة (Modal) تعديل بيانات الموظف -->
<div id="editModal" class="modal" style="display: none;">
  <div class="modal-content">
    <h3>تعديل بيانات الموظف</h3>
    <form id="editForm" onsubmit="event.preventDefault(); saveEmployeeChanges();">
      <input type="hidden" id="editCode">
      
      <div class="form-group">
        <label for="editName">اسم الموظف:</label>
        <input type="text" id="editName" required>
      </div>

      <div class="form-group">
        <label for="editNationalId">رقم الهوية:</label>
        <input type="text" id="editNationalId">
      </div>

      <div class="form-group">
        <label for="editPhone">رقم الهاتف:</label>
        <input type="text" id="editPhone">
      </div>

      <div class="form-group">
        <label for="editSalary">المبلغ:</label>
        <input type="text" id="editSalary">
      </div>

      <div class="form-group">
        <label for="editRate">النسبة:</label>
        <input type="text" id="editRate">
      </div>

      <div class="modal-actions">
        <button type="submit" class="btn btn-save">حفظ التغييرات</button>
        <button type="button" class="btn btn-cancel" onclick="closeEditModal()">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
